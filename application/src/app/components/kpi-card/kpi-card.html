<div class="kpi">

    <div class="kpi-header">
        <div class="kpi-icon">
            {{ icone }}
        </div>

        <span>{{ titulo }}</span>
    </div>

    <strong class="kpi-value">
        {{ valor }}
    </strong>

        @if (detalhe) {
        <span class="kpi-detalhe">{{ detalhe }}</span>
    } @else {
        <span class="kpi-variation">
            ↑ {{ variacao }} vs. período anterior
        </span>
    }

</div>
