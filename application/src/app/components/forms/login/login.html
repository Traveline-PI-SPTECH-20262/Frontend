
<app-modal-erro
    [aberto]="modalErroAberto"
    [mensagemErro]="mensagemErro"
    (fecharErro)="fecharErro()">
</app-modal-erro>
<div class="formulario-login">

    <div class="campo-formulario">
        <label for="emailLogin">E-mail corporativo</label>

        <input
            id="emailLogin"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nome@suaagencia.com.br"
            required>
    </div>

    <div class="campo-formulario">
        <label for="senhaLogin">Senha</label>

        <input
            id="senhaLogin"
            type="password"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Digite sua senha"
            required>
    </div>

    <div class="opcoes-login">
        <label class="lembrar-dispositivo">
            <input type="checkbox" name="remember">
            <span>Lembrar dispositivo</span>
        </label>

        <a class="recuperar-senha" href="#">
            Esqueci minha senha
        </a>
    </div>

    <button
        type="button"
        class="botao-login"
        (click)="login()">
        Entrar no Dashboard
    </button>

</div>
