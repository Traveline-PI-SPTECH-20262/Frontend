
<app-modal-erro
    [aberto]="modalErroAberto"
    [mensagemErro]="mensagemErro"
    (fecharErro)="fecharErro()">
</app-modal-erro>

<div class="formulario-cadastro">

    <div class="campo-formulario">
        <label for="codigoAgencia">Código da agência</label>

        <input
            id="codigoAgencia"
            type="text"
            name="codigoAtivacao"
            [(ngModel)]="codigoAtivacao"
            placeholder="Ex.: TRV-A7K92"
            required>
    </div>

    <div class="campo-formulario">
        <label for="nomeFuncionario">Nome do funcionário</label>

        <input
            id="nomeFuncionario"
            type="text"
            name="nome"
            [(ngModel)]="nome"
            placeholder="Seu nome completo"
            required>
    </div>

    <div class="campo-formulario">
        <label for="cargoFuncionario">Cargo</label>

        <input
            id="cargoFuncionario"
            type="text"
            name="cargo"
            [(ngModel)]="cargo"
            placeholder="Ex.: Analista"
            required>
    </div>

    <div class="campo-formulario">
        <label for="emailCadastro">E-mail corporativo</label>

        <input
            id="emailCadastro"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nome@suaagencia.com.br"
            required>
    </div>

    <div class="campo-formulario">
        <label for="senhaCadastro">Senha</label>

        <input
            id="senhaCadastro"
            type="password"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Crie uma senha forte"
            required>
    </div>

    <button
        type="button"
        class="botao-cadastro"
        (click)="register()">
        Criar conta
    </button>

</div>
