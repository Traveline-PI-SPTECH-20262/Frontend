
<app-modal-erro
    [aberto]="modalErroAberto"
    [mensagemErro]="mensagemErro"
    (fecharErro)="fecharErro()">
</app-modal-erro>

<div class="formulario-cadastro">

    <div class="campo-formulario">
        <label for="codigoAgencia">Código da agência</label>

        <input
            id="codigoAgencia"
            type="text"
            name="codigoAtivacao"
            [(ngModel)]="codigoAtivacao"
            placeholder="Ex.: TRV-A7K92"
            required>
    </div>

    <div class="campo-formulario">
        <label for="nomeFuncionario">Nome do funcionário</label>

        <input
            id="nomeFuncionario"
            type="text"
            name="nome"
            [(ngModel)]="nome"
            placeholder="Seu nome completo"
            required>
    </div>

    <div class="campo-formulario">
        <label for="cargoFuncionario">Cargo</label>

        <select id="cargoFuncionario" name="idCargo" [(ngModel)]="idCargo" required>
            <option [ngValue]="null" disabled>Selecione seu cargo</option>
            @for (cargo of cargos; track cargo.idCargo) {
                <option [ngValue]="cargo.idCargo">{{ cargo.cargo }}</option>
            }
        </select>
    </div>

    <div class="campo-formulario">
        <label for="emailCadastro">E-mail corporativo</label>

        <input
            id="emailCadastro"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="nome@suaagencia.com.br"
            required>
    </div>

    <div class="campo-formulario">
        <label for="senhaCadastro">Senha</label>

        <input
            id="senhaCadastro"
            [type]="verSenha ? 'text' : 'password'"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Crie uma senha forte"
            required>
    </div>

    <label class="ver-senha">
        <input type="checkbox" name="verSenha" [(ngModel)]="verSenha">
        <span>Ver senha</span>
    </label>

    <button
        type="button"
        class="botao-cadastro"
        (click)="register()">
        Criar conta
    </button>

</div>
