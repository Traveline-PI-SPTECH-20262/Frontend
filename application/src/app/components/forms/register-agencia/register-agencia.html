
<app-modal-erro
    [aberto]="modalErroAberto"
    [mensagemErro]="mensagemErro"
    (fecharErro)="fecharErro()">
</app-modal-erro>

<div class="formulario-cadastro-agencia">
    <div class="campo-formulario">
        <label for="nomeFuncionario">Nome da Agência</label>

        <input
            id="nomeAgencia"
            type="text"
            name="nome"
            [(ngModel)]="nomeAgencia"
            placeholder="Nome da agência"
            required>
    </div>

    <div class="campo-formulario">
        <label for="nomeFuncionario">CNPJ da Agência</label>
        <input
            id="cnpjAgencia"
            type="text"
            name="cnpj"
            [(ngModel)]="cnpj"
            placeholder="00.000.000/0000-00"
            required>
    </div>

    <div class="campo-formulario">
        <label for="emailCadastro">E-mail da Agência</label>

        <input
            id="emailAgencia"
            type="email"
            name="email"
            [(ngModel)]="emailAgencia"
            placeholder="nome@suaagencia.com.br"
            required>
    </div>

    <div class="campo-formulario">
        <label for="numeroAgencia">Número da Agência</label>

        <input
            id="numeroAgencia"
            type="text"
            name="numero"
            [(ngModel)]="numero"
            placeholder="(00) 00000-0000"
            required>
    </div>

    <button
        type="button"
        class="botao-cadastro"
        (click)="cadastrarAgencia()">
        Cadastrar agência
    </button>

</div>
