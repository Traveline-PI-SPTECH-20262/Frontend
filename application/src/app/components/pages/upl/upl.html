<main>
    <app-header
        titulo="Upload da base de dados"
        descricao="Suba a sua base de dados para ser analisada."
    >
    </app-header>

    <div class="upload-container">
        <div class="zona-carregamento" (dragover)="$event.preventDefault()" (drop)="receberArquivo($event, fileInput)">
        <h2>Clique ou arraste arquivos para upload</h2>
        <p>ou</p>
        <label for="fileInput" class="button-carregar"> Selecionar arquivo </label>
        <input
            #fileInput
            id="fileInput"
            [disabled]="enviando"
            type="file"
            accept=".xlsx,.xls"
            (change)="onFileSelected($event)"
            hidden
        />
        </div>
        @if (selectedFile) {
        <div class="info-arquivo">
            <div>
            <strong>{{ selectedFile.name }}</strong>
            </div>
            <button type="button" class="button-remover" [disabled]="enviando" (click)="removeFile(fileInput)">Remover</button>
        </div>
        }
        <button type="button" class="button-enviar" [disabled]="!selectedFile || enviando" (click)="enviarArquivo(fileInput)">{{enviando ? 'Enviando...' : 'Enviar'}}</button>
        @if(mensagem){
            <p class="mensagem-upload" [class.erro-upload]="erroEnvio" role="status">{{mensagem}}</p>
        }
    </div>
    <app-historico-upload></app-historico-upload>
</main>
